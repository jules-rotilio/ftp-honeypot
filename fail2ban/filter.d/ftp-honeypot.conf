# fail2ban filter for ftp-honeypot
# Matches every new connection logged by honeypot.py, e.g.:
# {"ts": "2026-10-11T16:20:00Z", "event": "connect", "src": "203.0.113.7", "sport": 51234}

[Definition]
# fail2ban removes the matched timestamp first, so the line then starts at the comma.
failregex = ^, "event": "connect", "src": "<HOST>"
ignoreregex =

# Timestamps in the log are UTC ("Z"); the jail sets logtimezone = UTC.
datepattern = ^\{"ts": "%%Y-%%m-%%dT%%H:%%M:%%SZ"
