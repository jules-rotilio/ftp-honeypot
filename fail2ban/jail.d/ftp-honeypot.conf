# fail2ban jail for ftp-honeypot
# Nothing legitimate ever connects to this port, so one hit = ban on ALL ports.

[ftp-honeypot]
enabled     = true
filter      = ftp-honeypot
logpath     = /var/log/ftp-honeypot/ftp-honeypot.log
backend     = polling
logtimezone = UTC

maxretry    = 1
findtime    = 10m
bantime     = 1d

# Repeat offenders get longer bans: 1d, 2d, 4d ... up to 4 weeks.
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 4w

banaction   = nftables-allports

# NEVER ban yourself: loopback, your LAN, your own public IPs.
# install.sh fills this in; edit it if your networks change.
ignoreip    = 127.0.0.1/8 ::1 @IGNOREIP@
