# fail2ban jail for ftp-honeypot
# Nothing legitimate ever connects to this port, so one hit = ban on ALL ports.

[ftp-honeypot]
enabled     = true
filter      = ftp-honeypot
logpath     = /var/log/ftp-honeypot/ftp-honeypot.log
backend     = polling
logtimezone = UTC

maxretry    = 1
findtime    = 10m
bantime     = 1mo

# Repeat offenders get longer bans: 1mo, 2mo, 4mo, 8mo, then 1y.
# fail2ban already doubles on each repeat ban; bantime.factor multiplies on
# top of that, so keep it at 1 for plain doubling (2 would give 1mo, 4mo, 8mo).
# Needs dbpurgeage >= bantime.maxtime: see fail2ban.d/ftp-honeypot.conf.
bantime.increment = true
bantime.factor    = 1
bantime.maxtime   = 1y

# Block in the nftables *prerouting* hook (priority -150, before Docker's DNAT
# at -100), not fail2ban's default *input* hook: traffic to Docker containers
# (published ports) is forwarded and never goes through input, so an input
# rule would only protect services running directly on the host.
# Own table/chain so it never clashes with other jails' f2b-table/f2b-chain.
# "drop" because "reject" is not allowed in prerouting. protocol=0-255 matches
# every IP protocol ("all" is not valid nft syntax and makes the ban fail).
action      = nftables-allports[name=ftp-honeypot, table=f2b-honeypot, chain=f2b-prerouting, chain_hook=prerouting, chain_priority=-150, blocktype=drop, protocol=0-255]

# NEVER ban yourself: loopback is always here; install.sh adds your LAN
# (--ignore-local) and any address given with --ignore. Edit as needed.
ignoreip    = 127.0.0.1/8 ::1 @IGNOREIP@
