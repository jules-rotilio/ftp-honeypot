# fail2ban server settings for ftp-honeypot
#
# fail2ban forgets bans older than dbpurgeage (default 1d). With bans of
# 1 month to 1 year it must be at least as long as bantime.maxtime, or:
#  - bans older than that are not restored after a restart/reboot,
#  - repeat offenders are never recognised, so bans never get longer.
#
# Note: this setting is global and applies to every fail2ban jail.

[DEFAULT]
dbpurgeage = 1y
